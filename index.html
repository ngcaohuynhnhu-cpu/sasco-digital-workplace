function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(s){if(!s)return 'Chưa xác định';const p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:esc(s)}
function until(s){if(!s)return 999;return Math.round((Date.parse(s+'T00:00:00Z')-Date.parse(TODAY+'T00:00:00Z'))/86400000)}
function currentStatus(t){return t.status!=='Hoàn thành'&&until(t.due)<0?'Quá hạn':t.status}
function palette(s){return ['Hoàn thành','Đã đóng','Đã phê duyệt','Đang áp dụng'].includes(s)?'green':['Quá hạn','Từ chối','Hết hiệu lực'].includes(s)?'red':['Chờ phối hợp','Chờ xem xét','Chờ phê duyệt','Yêu cầu bổ sung','Sắp hiệu lực'].includes(s)?'amber':['Đang thực hiện','Đang xử lý','Dự thảo'].includes(s)?'blue':'gray'}
function badge(s){return `<span class="pill ${palette(s)}">${esc(s)}</span>`}
function btn(label,action,extra='',style=''){return `<button type="button" class="btn ${style}" data-action="${action}" ${extra}>${label}</button>`}
function stats(){return {tasks:db.tasks.length,doing:db.tasks.filter(t=>t.status==='Đang thực hiện').length,dueSoon:db.tasks.filter(t=>t.status!=='Hoàn thành'&&until(t.due)>=0&&until(t.due)<=3).length,overdue:db.tasks.filter(t=>currentStatus(t)==='Quá hạn').length,done:db.tasks.filter(t=>t.status==='Hoàn thành').length,pending:db.approvals.filter(a=>['Chờ phê duyệt','Chờ xem xét'].includes(a.status)).length,caseOpen:db.cases.filter(c=>c.status!=='Đã đóng').length,docsActive:db.docs.filter(d=>d.status==='Đang áp dụng').length}}
function getObj(kind,id){return ({task:db.tasks,approval:db.approvals,case:db.cases,doc:db.docs}[kind]||[]).find(o=>o.id===id)}
function link(kind,id,text){let o=getObj(kind,id);return o?`<button type="button" class="row-link" data-action="open-detail" data-kind="${kind}" data-id="${esc(id)}">${esc(text||o.name)}</button>`:`<span class="muted">${esc(id)}</span>`}

ss="section-head"><h2>Truy cập nhanh 04 nhóm công cụ</h2><span class="muted mini">Các nhóm hoạt động trong một giao diện dùng chung</span></div><div class="grid g4">${[['tasks','▣','Công việc & Nhiệm vụ','Giao việc, theo dõi tiến độ, kiểm soát thời hạn.'],['approvals','✓','Quy trình & Phê duyệt','Tạo hồ sơ, chuyển bước, xem lịch sử quyết định.'],['cases','◇','Yêu cầu & Vụ việc','Tiếp nhận, phân công, xử lý, đóng vụ việc.'],['docs','▤','Tài liệu & Quy định','Tra cứu phiên bản, hiệu lực, quyền truy cập.']].map(([p,i,t,desc])=>`<button class="module-card" type="button" data-action="nav" data-page="${p}"><span class="module-icon">${i}</span><strong>${t}</strong><span>${desc}</span><em>Khám phá →</em></button>`).join('')}</div><div class="split"><div><div class="section-head"><h2>Việc cần quan tâm</h2>${btn('Xem tất cả →','nav','data-page="tasks"','sm')}</div><div class="panel">${tasks.length?tasks.map(t=>`<button class="item-row" type="button" data-action="open-detail" data-kind="task" data-id="${t.id}"><span class="row-index">${t.id.replace('CV-','')}</span><span class="item-main"><strong>${esc(t.name)}</strong><small>${esc(t.assignee)} · Hạn ${date(t.due)}</small></span>${badge(currentStatus(t))}</button>`).join(''):`<div class="empty">Không có nhiệm vụ đang mở ở vai trò hiện tại. Có thể đổi vai trò để xem.</div>`}</div></div><div><div class="section-head"><h2>Hồ sơ & tài liệu cần chú ý</h2>${btn('Tra cứu →','nav','data-page="docs"','sm')}</div><div class="panel">${approvals.map(a=>`<button class="item-row" type="button" data-action="open-detail" data-kind="approval" data-id="${a.id}"><span class="row-index">HS</span><span class="item-main"><strong>${esc(a.name)}</strong><small>${a.id} · Hồ sơ chờ vai trò hiện tại</small></span>${badge(a.status)}</button>`).join('')}${db.docs.filter(d=>['Sắp hiệu lực','Dự thảo'].includes(d.status)).slice(0,2).map(d=>`<button class="item-row" type="button" data-action="open-detail" data-kind="doc" data-id="${d.id}"><span class="row-index">TL</span><span class="item-main"><strong>${esc(d.name)}</strong><small>${d.id} · Phiên bản ${d.version}</small></span>${badge(d.status)}</button>`).join('')}</div></div></div>${foot()}`}
function tasksPage(){let list=db.tasks.filter(t=>(ui.filter==='Tất cả'||ui.filter==='Của tôi'&&t.assignee===ui.role||ui.filter==='Đơn vị'&&t.owner===ui.role)&&(ui.statusFilter==='Tất cả'||currentStatus(t)===ui.statusFilter));let s=stats();return header('Nhóm công cụ 01','Công việc & Nhiệm vụ','Giao nhiệm vụ, ghi nhận trách nhiệm, cập nhật tiến độ, xem công việc liên quan và lịch sử xử lý.',btn('+ Giao nhiệm vụ','open-form','data-form="task"','primary'))+`<div class="grid g4"><div class="panel stat"><strong>${s.tasks}</strong><div class="label">Tổng nhiệm vụ</div></div><div class="panel stat"><strong>${s.doing}</strong><div class="label">Đang thực hiện</div></div><div class="panel stat"><strong>${s.overdue}</strong><div class="label">Quá hạn</div></div><div class="panel stat"><strong>${s.done}</strong><div class="label">Đã hoàn thành</div></div></div><div class="toolbar"><div class="tabs">${['Tất cả','Của tôi','Đơn vị'].map(f=>`<button class="tab ${ui.filter===f?'active':''}" data-action="task-tab" data-value="${f}">${f}</button>`).join('')}</div><div class="controls"><label class="muted mini">Trạng thái</label><select id="task-status-filter">${['Tất cả','Chưa thực hiện','Đang thực hiện','Chờ phối hợp','Hoàn thành','Quá hạn'].map(v=>`<option ${ui.statusFilter===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="panel tablewrap"><table class="data-table"><thead><tr><th>Mã / Công việc</th><th>Phụ trách</th><th>Ưu tiên</th><th>Thời hạn</th><th>Tiến độ</th><th>Trạng thái</th></tr></thead><tbody>${list.map(t=>`<tr><td><small class="muted">${t.id}</small><div>${link('task',t.id)}</div></td><td>${esc(t.assignee)}</td><td>${esc(t.priority)}</td><td>${date(t.due)}</td><td style="min-width:110px"><div class="bar"><div style="width:${Number(t.progress)||0}%"></div></div><small class="muted">${t.progress}%</small></td><td>${badge(currentStatus(t))}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">Không có công việc phù hợp bộ lọc.</div>':''}</div>${foot()}`}
function approvalsPage(){let list=db.approvals.filter(a=>ui.filter!=='Chờ tôi xử lý'||a.assigned===ui.role&&['Chờ phê duyệt','Chờ xem xét'].includes(a.status));return header('Nhóm công cụ 02','Quy trình & Phê duyệt','Minh họa luồng biểu mẫu → xem xét → phê duyệt/xác nhận → hoàn tất. Không đại diện quy trình phê duyệt thật.',btn('+ Tạo đề xuất','open-form','data-form="approval"','primary'))+`<div class="notice">Quy trình minh họa sử dụng 03 bước đơn giản để trình bày; thẩm quyền và các tuyến duyệt thực tế phải được SASCO xác minh riêng.</div><div class="toolbar"><div class="tabs">${['Tất cả','Chờ tôi xử lý'].map(f=>`<button class="tab ${ui.filter===f?'active':''}" data-action="approval-tab" data-value="${f}">${f}</button>`).join('')}</div><span class="muted mini">${list.length} hồ sơ · Dữ liệu minh họa</span></div><div class="panel tablewrap"><table class="data-table"><thead><tr><th>Hồ sơ</th><th>Người/đơn vị tạo</th><th>Đang xử lý bởi</th><th>Bước</th><th>Trạng thái</th></tr></thead><tbody>${list.map(a=>`<tr><td><small class="muted">${a.id}</small><div>${link('approval',a.id)}</div></td><td>${esc(a.creator)}</td><td>${esc(a.assigned||'Đã hoàn tất')}</td><td>${a.step}/3</td><td>${badge(a.status)}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">Không có hồ sơ trong bộ lọc này.</div>':''}</div>${foot()}`}
function casesPage(){let list=db.cases.filter(c=>ui.statusFilter==='Tất cả'||c.status===ui.statusFilter);return header('Nhóm công cụ 03','Yêu cầu & Vụ việc','Đầu mối tiếp nhận tập trung, phân loại, phân công và theo dõi đến khi có kết quả xử lý.',btn('+ Tiếp nhận yêu cầu','open-form','data-form="case"','primary'))+`<div class="toolbar"><div class="tabs"><button class="tab ${ui.statusFilter==='Tất cả'?'active':''}" data-action="case-filter" data-value="Tất cả">Tất cả</button><button class="tab ${ui.statusFilter==='Mới tiếp nhận'?'active':''}" data-action="case-filter" data-value="Mới tiếp nhận">Mới</button><button class="tab ${ui.statusFilter==='Đang xử lý'?'active':''}" data-action="case-filter" data-value="Đang xử lý">Đang xử lý</button><button class="tab ${ui.statusFilter==='Đã đóng'?'active':''}" data-action="case-filter" data-value="Đã đóng">Đã đóng</button></div><span class="muted mini">Một vụ việc có thể phát sinh nhiệm vụ liên kết</span></div><div class="panel tablewrap"><table class="data-table"><thead><tr><th>Mã / Tên vụ việc</th><th>Phân loại</th><th>Người phụ trách</th><th>Thời hạn</th><th>Trạng thái</th></tr></thead><tbody>${list.map(c=>`<tr><td><small class="muted">${c.id}</small><div>${link('case',c.id)}</div></td><td>${esc(c.type)}</td><td>${esc(c.assignee||'Chưa phân công')}</td><td>${date(c.due)}</td><td>${badge(c.status)}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">Chưa có vụ việc ở trạng thái này.</div>':''}</div>${foot()}`}
function docsPage(){let list=db.docs.filter(d=>(ui.docStatus==='Tất cả'||d.status===ui.docStatus)&&(ui.docType==='Tất cả'||d.type===ui.docType)&&(ui.docOwner==='Tất cả'||d.owner===ui.docOwner)&&(d.name+' '+d.id+' '+d.summary).toLowerCase().includes(ui.docSearch.toLowerCase()));return header('Nhóm công cụ 04','Tài liệu & Quy định','Tra cứu có kiểm soát về chủ sở hữu, phiên bản, hiệu lực và hồ sơ/tài liệu liên quan.')+`<div class="notice">Khác với thư mục lưu file thông thường, mỗi tài liệu ở đây có metadata: phiên bản, trạng thái hiệu lực, đơn vị quản lý và lịch sử thay đổi.</div><div class="toolbar"><div class="controls"><input id="doc-search" aria-label="Tìm tài liệu" placeholder="Tìm tên hoặc mã tài liệu" value="${esc(ui.docSearch)}"><select id="doc-status" aria-label="Lọc hiệu lực">${['Tất cả','Đang áp dụng','Sắp hiệu lực','Hết hiệu lực','Dự thảo'].map(v=>`<option ${ui.docStatus===v?'selected':''}>${v}</option>`).join('')}</select><select id="doc-type" aria-label="Lọc loại tài liệu">${['Tất cả','Quy trình','Quy định','Hướng dẫn','Tiêu chuẩn'].map(v=>`<option ${ui.docType===v?'selected':''}>${v}</option>`).join('')}</select><select id="doc-owner" aria-label="Lọc đơn vị quản lý">${['Tất cả',...roles.slice(1)].map(v=>`<option ${ui.docOwner===v?'selected':''}>${v}</option>`).join('')}</select></div><span class="muted mini">${list.length} tài liệu minh họa</span></div><div class="panel tablewrap"><table class="data-table"><thead><tr><th>Tài liệu</th><th>Loại</th><th>Đơn vị quản lý</th><th>Phiên bản</th><th>Hiệu lực từ</th><th>Trạng thái</th></tr></thead><tbody>${list.map(d=>`<tr><td><small class="muted">${d.id}</small><div>${link('doc',d.id)}</div></td><td>${esc(d.type)}</td><td>${esc(d.owner)}</td><td>v${esc(d.version)}</td><td>${date(d.effective)}</td><td>${badge(d.status)}</td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">Không tìm thấy tài liệu. Thử thay đổi bộ lọc.</div>':''}</div>${foot()}`}
function dashboardPage(){let s=stats(),taskGroups=[['Chưa thực hiện',db.tasks.filter(t=>t.status==='Chưa thực hiện').length],['Đang thực hiện',s.doing],['Chờ phối hợp',db.tasks.filter(t=>t.status==='Chờ phối hợp').length],['Hoàn thành',s.done],['Quá hạn',s.overdue]],approvalGroups=[['Chờ xem xét',db.approvals.filter(a=>a.status==='Chờ xem xét').length],['Chờ phê duyệt',db.approvals.filter(a=>a.status==='Chờ phê duyệt').length],['Đã phê duyệt',db.approvals.filter(a=>a.status==='Đã phê duyệt').length],['Yêu cầu bổ sung',db.approvals.filter(a=>a.status==='Yêu cầu bổ sung').length]],caseGroups=[['Mới tiếp nhận',db.cases.filter(c=>c.status==='Mới tiếp nhận').length],['Đang xử lý',db.cases.filter(c=>c.status==='Đang xử lý').length],['Chờ phối hợp',db.cases.filter(c=>c.status==='Chờ phối hợp').length],['Đã đóng',db.cases.filter(c=>c.status==='Đã đóng').length]],docGroups=[['Đang áp dụng',s.docsActive],['Sắp hiệu lực',db.docs.filter(d=>d.status==='Sắp hiệu lực').length],['Hết hiệu lực',db.docs.filter(d=>d.status==='Hết hiệu lực').length],['Dự thảo',db.docs.filter(d=>d.status==='Dự thảo').length]];
let metric=(name,arr,all)=>`<div class="panel panel-pad"><h2 style="margin:0 0 7px;font-size:15px;color:var(--navy)">${name}</h2>${arr.map(([label,count])=>`<div class="bar-row"><div class="bar-top"><span>${esc(label)}</span><strong>${count}</strong></div><div class="bar"><div style="width:${all?Math.max(2,Math.round(count/all*100)):0}%"></div></div></div>`).join('')}</div>`;
return header('Báo cáo dùng chung','Tổng quan điều hành','Số liệu được tổng hợp trực tiếp từ bốn nhóm dữ liệu giả lập. Không phải số liệu hoạt động của SASCO.',btn('↻ Đặt lại dữ liệu demo','reset-data','',''))+`<div class="grid g4"><div class="panel stat"><strong>${s.tasks}</strong><div class="label">Tổng nhiệm vụ</div></div><div class="panel stat"><strong>${s.pending}</strong><div class="label">Hồ sơ cần xử lý</div></div><div class="panel stat"><strong>${s.caseOpen}</strong><div class="label">Vụ việc chưa đóng</div></div><div class="panel stat"><strong>${s.docsActive}</strong><div class="label">Tài liệu đang áp dụng</div></div></div><div class="section-head"><h2>Trạng thái theo nhóm công cụ</h2><span class="pill teal">Tự cập nhật khi thao tác trên demo</span></div><div class="grid g2">${metric('01 · Công việc & Nhiệm vụ',taskGroups,s.tasks)}${metric('02 · Quy trình & Phê duyệt',approvalGroups,db.approvals.length)}${metric('03 · Yêu cầu & Vụ việc',caseGroups,db.cases.length)}${metric('04 · Tài liệu & Quy định',docGroups,db.docs.length)}</div><div class="section-head"><h2>Nhiệm vụ cần lưu ý</h2></div><div class="panel">${db.tasks.filter(t=>currentStatus(t)==='Quá hạn'||until(t.due)>=0&&until(t.due)<=3&&t.status!=='Hoàn thành').map(t=>`<button class="item-row" type="button" data-action="open-detail" data-kind="task" data-id="${t.id}"><span class="row-index">${t.id}</span><span class="item-main"><strong>${esc(t.name)}</strong><small>Đơn vị: ${esc(t.assignee)} · Hạn ${date(t.due)}</small></span>${badge(currentStatus(t))}</button>`).join('')}</div><div class="notice" style="margin-top:20px">Nguyên tắc minh họa: Báo cáo quản trị là <strong>năng lực dùng chung</strong> của nền tảng, không phải nhóm công cụ thứ năm.</div>${foot()}`}
function connectionsPage(){const items=[['Nhân sự','Thông tin tổ chức và người dùng'],['Tài chính / Kế toán','Tra cứu trạng thái hồ sơ liên quan'],['Mua hàng','Luồng phối hợp yêu cầu'],['Kho','Tra cứu thông tin liên quan'],['Bán hàng','Thông tin báo cáo mức tổng quan'],['Bảo trì','Tiếp nhận yêu cầu ở lớp dùng chung'],['Email','Thông báo đến người sử dụng'],['Hệ thống chuyên ngành','Trao đổi dữ liệu khi cần']];return header('Năng lực mở rộng','Hệ thống kết nối','Chỉ thể hiện khả năng kết nối về mặt mô hình; không có kết nối, dữ liệu hay tích hợp kỹ thuật thực tế.')+`<div class="notice"><strong>Minh họa khả năng kết nối – phạm vi tích hợp thực tế sẽ được xác định sau.</strong> Danh sách dưới đây là các loại hệ thống thường gặp, không khẳng định SASCO đang sử dụng các hệ thống cụ thể này.</div><div class="grid g4">${items.map(([name,desc],idx)=>`<button class="module-card" type="button" data-action="connection-info" data-id="${idx}"><span class="module-icon">⇄</span><strong>${esc(name)}</strong><span>${esc(desc)}</span><em>Chưa tích hợp · Xem lưu ý →</em></button>`).join('')}</div><div class="section-head"><h2>Nguyên tắc kiến trúc minh họa</h2></div><div class="panel panel-pad"><div class="grid g3"><div class="callout"><strong>Môi trường dùng chung</strong><p>Người dùng truy cập bốn nhóm công cụ trong cùng giao diện.</p></div><div class="callout"><strong>Dữ liệu có liên kết</strong><p>Nhiệm vụ, hồ sơ, vụ việc và tài liệu dẫn chiếu được lẫn nhau.</p></div><div class="callout"><strong>Kết nối có kiểm soát</strong><p>Chỉ nghiên cứu tích hợp khi đã rõ nhu cầu, quyền truy cập và nguồn dữ liệu.</p></div></div></div>${foot()}`}
function searchPage(){let q=ui.search.toLocaleLowerCase('vi');let kinds=[['task',db.tasks,'Công việc & Nhiệm vụ'],['approval',db.approvals,'Quy trình & Phê duyệt'],['case',db.cases,'Yêu cầu & Vụ việc'],['doc',db.docs,'Tài liệu & Quy định']];let results=kinds.map(([kind,arr,label])=>({kind,label,results:arr.filter(o=>(o.name+' '+o.id+' '+(o.description||'')+' '+(o.summary||'')).toLocaleLowerCase('vi').includes(q))})).filter(x=>x.results.length);return header('Tìm kiếm dùng chung',`Kết quả: ${ui.search||'Tất cả dữ liệu'}`,'Một ô tìm kiếm giúp truy cập công việc, hồ sơ, vụ việc và tài liệu trong demo. Không phải công cụ tìm kiếm thực tế của SASCO.')+(results.length?results.map(g=>`<div class="section-head"><h2>${g.label} (${g.results.length})</h2></div><div class="panel">${g.results.map(o=>`<button class="item-row" type="button" data-action="open-detail" data-kind="${g.kind}" data-id="${o.id}"><span class="row-index">${o.id}</span><span class="item-main"><strong>${esc(o.name)}</strong><small>Nhấn để xem chi tiết và liên kết</small></span>${badge(g.kind==='task'?currentStatus(o):o.status)}</button>`).join('')}</div>`).join(''):'<div class="panel empty">Không có kết quả phù hợp. Thử nhập từ khóa khác.</div>')+foot()}
function taskDetail(t){let opts=['Chưa thực hiện','Đang thực hiện','Chờ phối hợp','Hoàn thành'];return `<div class="drawer-section"><h3>Thông tin công việc</h3><dl class="kv"><dt>Đơn vị chủ trì</dt><dd>${esc(t.owner)}</dd><dt>Người xử lý</dt><dd>${esc(t.assignee)}</dd><dt>Thời hạn</dt><dd>${date(t.due)}</dd><dt>Ưu tiên</dt><dd>${esc(t.priority)}</dd><dt>Tiến độ</dt><dd>${t.progress}%</dd><dt>Trạng thái</dt><dd>${badge(currentStatus(t))}</dd></dl><p class="muted mini">${esc(t.description)}</p></div><div class="drawer-section"><h3>Cập nhật tiến độ (demo thao tác)</h3><label class="field"><span>Trạng thái mới</span><select id="task-new-status">${opts.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="field"><span>Tiến độ (%)</span><input id="task-progress" type="number" min="0" max="100" value="${t.progress}"></label><label class="field"><span>Nội dung cập nhật</span><textarea id="task-note" placeholder="Ví dụ: Đã hoàn tất rà soát 02 đầu mục minh họa"></textarea></label>${btn('Lưu cập nhật','task-update',`data-id="${t.id}"`,'primary')}</div><div class="drawer-section"><h3>Hồ sơ / dữ liệu liên quan</h3>${relatedHtml(t.related)}</div><div class="drawer-section"><h3>Lịch sử xử lý</h3>${history(t.history)}</div>`}
function approvalDetail(a){let stepName=['Đơn vị tạo hồ sơ','Trưởng đơn vị xem xét','Cấp có thẩm quyền phê duyệt'];let completed=a.status==='Đã phê duyệt',rejected=a.status==='Từ chối';let actionBtns='';if(a.status==='Yêu cầu bổ sung') actionBtns=btn('Gửi lại sau bổ sung','approval-action',`data-id="${a.id}" data-value="resubmit"`,'primary');else if(!completed&&!rejected){actionBtns=`${btn(a.step===1?'Thông qua bước xem xét':'Phê duyệt','approval-action',`data-id="${a.id}" data-value="approve"`,'primary')}${btn('Yêu cầu bổ sung','approval-action',`data-id="${a.id}" data-value="revise"`)}${btn('Chuyển xử lý','approval-action',`data-id="${a.id}" data-value="transfer"`)}${btn('Từ chối','approval-action',`data-id="${a.id}" data-value="reject"`,'danger')}`}
return `<div class="drawer-section"><h3>Tình trạng xử lý</h3><dl class="kv"><dt>Người/đơn vị tạo</dt><dd>${esc(a.creator)}</dd><dt>Ngày tạo</dt><dd>${date(a.created)}</dd><dt>Đang xử lý bởi</dt><dd>${esc(a.assigned||'Đã hoàn tất')}</dd><dt>Trạng thái</dt><dd>${badge(a.status)}</dd></dl><p class="muted mini">${esc(a.description)}</p></div><div class="drawer-section"><h3>Luồng xử lý 03 bước (giả lập)</h3><div class="activity">${stepName.map((n,i)=>`<div class="event"><strong>${i+1}. ${n} ${i<a.step?'✓':''}</strong><p>${i+1===a.step&&!(completed||rejected)?'Bước hiện tại · '+esc(a.assigned):i+1<a.step?'Đã đi qua bước này':'Bước tiếp theo / chưa thực hiện'}</p></div>`).join('')}</div></div>${actionBtns?`<div class="drawer-section"><h3>Thao tác xử lý</h3><p class="muted mini">Chuyển vai trò phía trên sang <strong>${esc(a.assigned)}</strong> để thực hiện bước đang chờ.</p><label class="field"><span>Ghi chú xử lý (không bắt buộc)</span><textarea id="approval-note" placeholder="Ghi chú ngắn cho lần xử lý này"></textarea></label><div class="controls">${actionBtns}</div></div>`:''}<div class="drawer-section"><h3>Công việc / tài liệu liên quan</h3>${relatedHtml(a.related)}</div><div class="drawer-section"><h3>Lịch sử hồ sơ</h3>${history(a.history)}</div>`}
function caseDetail(c){let opts=roles.slice(1);return `<div class="drawer-section"><h3>Thông tin tiếp nhận</h3><dl class="kv"><dt>Loại yêu cầu</dt><dd>${esc(c.type)}</dd><dt>Kênh tiếp nhận</dt><dd>${esc(c.source)}</dd><dt>Ngày tiếp nhận</dt><dd>${date(c.created)}</dd><dt>Thời hạn</dt><dd>${date(c.due)}</dd><dt>Người xử lý</dt><dd>${esc(c.assignee||'Chưa phân công')}</dd><dt>Trạng thái</dt><dd>${badge(c.status)}</dd></dl><p class="muted mini">${esc(c.description)}</p></div>${c.status!=='Đã đóng'?`<div class="drawer-section"><h3>Phân công & xử lý</h3><label class="field"><span>Đơn vị xử lý</span><select id="case-assignee"><option value="">Chọn đơn vị</option>${opts.map(r=>`<option ${c.assignee===r?'selected':''}>${r}</option>`).join('')}</select></label><div class="controls">${btn('Lưu phân công','case-action',`data-id="${c.id}" data-value="assign"`,'primary')}${btn('+ Tạo nhiệm vụ liên kết','case-action',`data-id="${c.id}" data-value="task"`)}</div><label class="field" style="margin-top:19px"><span>Kết quả xử lý để đóng vụ việc</span><textarea id="case-result" placeholder="Nêu kết quả xử lý minh họa"></textarea></label>${btn('Đóng vụ việc','case-action',`data-id="${c.id}" data-value="close"`,'dark')}</div>`:`<div class="drawer-section"><h3>Kết quả xử lý</h3><div class="callout">${esc(c.result)}</div></div>`}<div class="drawer-section"><h3>Nhiệm vụ / tài liệu liên quan</h3>${relatedHtml(c.related)}</div><div class="drawer-section"><h3>Lịch sử vụ việc</h3>${history(c.history)}</div>`}
function docDetail(d){return `<div class="drawer-section"><h3>Hồ sơ kiểm soát tài liệu</h3><dl class="kv"><dt>Loại tài liệu</dt><dd>${esc(d.type)}</dd><dt>Đơn vị chủ sở hữu</dt><dd>${esc(d.owner)}</dd><dt>Phiên bản hiện tại</dt><dd>v${esc(d.version)}</dd><dt>Ngày ban hành</dt><dd>${date(d.issued)}</dd><dt>Ngày hiệu lực</dt><dd>${date(d.effective)}</dd><dt>Trạng thái</dt><dd>${badge(d.status)}</dd><dt>Phạm vi áp dụng</dt><dd>${esc(d.scope)}</dd><dt>Quyền truy cập</dt><dd>${esc(d.access)}</dd></dl><p class="muted mini">${esc(d.summary)}</p>${btn('Xem bản tài liệu minh họa','doc-preview',`data-id="${d.id}"`,'primary')}</div><div class="drawer-section"><h3>Lịch sử phiên bản</h3><div class="panel tablewrap"><table class="data-table"><thead><tr><th>Phiên bản</th><th>Ngày</th><th>Ghi chú</th></tr></thead><tbody>${d.versions.map(v=>`<tr><td>v${esc(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td></tr>`).join('')}</tbody></table></div></div><div class="drawer-section"><h3>Hồ sơ / nghiệp vụ liên quan</h3>${relatedHtml(d.related)}</div>`}
function drawer(){if(!ui.detail)return '';let {kind,id}=ui.detail,o=getObj(kind,id);if(!o)return '';let label={task:'Công việc & Nhiệm vụ',approval:'Quy trình & Phê duyệt',case:'Yêu cầu & Vụ việc',doc:'Tài liệu & Quy định'}[kind],part={task:taskDetail,approval:approvalDetail,case:caseDetail,doc:docDetail}[kind];return `<div class="overlay" data-dismiss="drawer"><aside class="drawer" role="dialog" aria-modal="true" aria-label="Chi tiết ${esc(label)}"><div class="drawer-header"><div class="drawer-headline"><div><div class="page-kicker">${esc(label)} · ${esc(o.id)}</div><h2>${esc(o.name)}</h2><div>${badge(kind==='task'?currentStatus(o):o.status)}</div></div><button class="iconbtn" type="button" data-action="close-detail" title="Đóng">✕</button></div></div><div class="drawer-body">${part(o)}</div></aside></div>`}
function field(name,label,type='text',placeholder='',required=true){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" ${required?'required':''} placeholder="${placeholder}"></label>`}
function formModal(){let f=ui.modal;if(!f)return '';let names={task:'Giao nhiệm vụ mới',approval:'Tạo đề xuất nội bộ',case:'Tiếp nhận yêu cầu mới'};let fields='';if(f==='task'){fields=field('name','Tên công việc *','text','Ví dụ: Rà soát báo cáo mẫu')+`<div class="twofield"><label class="field"><span>Đơn vị xử lý *</span><select name="assignee" required>${roles.slice(1).map(r=>`<option>${r}</option>`).join('')}</select></label><label class="field"><span>Độ ưu tiên</span><select name="priority"><option>Trung bình</option><option>Cao</option><option>Thấp</option></select></label></div>`+field('due','Thời hạn *','date','',true)+`<label class="field"><span>Nội dung</span><textarea name="description" placeholder="Mô tả nhiệm vụ giả lập"></textarea></label>`}else if(f==='approval'){fields=field('name','Tên đề xuất *','text','Ví dụ: Đề xuất phối hợp hoạt động mẫu')+`<label class="field"><span>Loại hồ sơ</span><select name="type"><option>Đề xuất nội bộ (mẫu)</option></select></label><label class="field"><span>Nội dung đề xuất</span><textarea name="description" placeholder="Mục tiêu, nội dung cần xem xét (dữ liệu minh họa)"></textarea></label>`}else if(f==='case'){fields=field('name','Tên yêu cầu/vụ việc *','text','Ví dụ: Yêu cầu kiểm tra mẫu')+`<label class="field"><span>Phân loại</span><select name="type">${['Phản hồi','Yêu cầu hỗ trợ','Sự không phù hợp','Yêu cầu phối hợp','Yêu cầu kiểm tra','Yêu cầu bảo dưỡng/sửa chữa'].map(v=>`<option>${v}</option>`).join('')}</select></label>`+field('due','Thời hạn xử lý *','date','',true)+`<label class="field"><span>Nội dung</span><textarea name="description" placeholder="Mô tả tình huống giả lập"></textarea></label>`}
return `<div class="modaloverlay" data-dismiss="modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(names[f])}"><div class="modal-header"><div><div class="page-kicker">Dữ liệu giả lập</div><h2>${names[f]}</h2><p class="subheading mini">Thao tác này chỉ thay đổi dữ liệu trong phiên demo trên trình duyệt.</p></div><button class="iconbtn" type="button" data-action="close-modal">✕</button></div><form id="create-form" data-form="${f}" class="modal-body">${fields}<div class="modal-footer">${btn('Hủy','close-modal') }<button class="btn primary" type="submit">Tạo mới</button></div></form></div></div>`}

 {name:'Trang chủ',sec:'Nội dung 1/7',page:'home',title:'Một môi trường làm việc chung',say:'Đây là một cách hình dung về Văn phòng điện tử dùng chung: người dùng có thể vào cùng một nơi để theo dõi việc cần xử lý, tìm hồ sơ và xem thông tin quản trị.',focus:'Nhận biết 04 nhóm công cụ và cách điều hướng từ trang chủ.'},
 {name:'Giao việc',sec:'Nội dung 2/7',page:'tasks',title:'Giao nhiệm vụ – cập nhật – giám sát',say:'Văn phòng Công ty có thể giao một nhiệm vụ, chỉ định người xử lý và thời hạn. Khi đơn vị cập nhật tiến độ, trạng thái được ghi nhận để tổng hợp.',focus:'Bấm Giao nhiệm vụ → tạo dữ liệu → mở nhiệm vụ → cập nhật tiến độ.'},
 {name:'Phê duyệt',sec:'Nội dung 3/7',page:'approvals',title:'Hồ sơ theo luồng có lịch sử',say:'Đề xuất được ghi nhận thành hồ sơ có trạng thái, người đang xử lý và lịch sử. Khi được phê duyệt, có thể phát sinh một nhiệm vụ liên kết.',focus:'Chọn vai trò Ban Tổng Giám đốc trong ô mô phỏng vai trò → mở HS-101 → Phê duyệt → mở nhiệm vụ liên kết.'},
 {name:'Vụ việc',sec:'Nội dung 4/7',page:'cases',title:'Tiếp nhận – phân công – xử lý',say:'Yêu cầu được tập trung tại một đầu mối, phân loại và giao xử lý. Hệ thống mẫu có thể tạo nhiệm vụ và liên kết trở lại vụ việc.',focus:'Mở VV-102 → phân công → tạo nhiệm vụ liên kết → xem công việc.'},
 {name:'Tài liệu',sec:'Nội dung 5/7',page:'docs',title:'Tìm đúng phiên bản đang hiệu lực',say:'Tài liệu không chỉ là file lưu trong thư mục. Mỗi tài liệu có thông tin chủ quản, phiên bản, hiệu lực và các hồ sơ liên quan.',focus:'Lọc Đang áp dụng → mở TL-101 → xem lịch sử phiên bản.'},
 {name:'Điều hành',sec:'Nội dung 6/7',page:'dashboard',title:'Tổng hợp số liệu từ các nhóm',say:'Các thông tin tổng hợp về nhiệm vụ, hồ sơ, vụ việc và tài liệu được hiển thị chung; số liệu trên demo đều là giả lập.',focus:'Quan sát số liệu thay đổi theo thao tác vừa thực hiện.'},
 {name:'Mở rộng',sec:'Nội dung 7/7',page:'connections',title:'Mở rộng có chọn lọc, không thay toàn bộ hệ thống',say:'Nền tảng chung có thể nghiên cứu kết nối với hệ thống chuyên ngành khi xác định rõ nhu cầu và khả năng tích hợp. Demo chưa đề xuất công nghệ, nhà cung cấp hay kinh phí.',focus:'Xem khả năng kết nối ở mức minh họa; không có tích hợp hệ thống thật hoặc quyết định triển khai.'}

function guide(){if(ui.modal!=='guide')return '';let z=scenes[ui.guideStep];return `<div class="modaloverlay" data-dismiss="modal"><div class="modal" role="dialog" aria-modal="true" aria-label="Hướng dẫn khám phá ứng dụng" style="width:min(680px,100%)"><div class="modal-header"><div><div class="page-kicker">HƯỚNG DẪN TRẢI NGHIỆM · 07 NỘI DUNG</div><h2>Khám phá các chức năng dùng chung</h2><p class="subheading mini">Chọn nội dung cần tìm hiểu để mở màn hình tương ứng và xem hướng dẫn thao tác.</p></div><button class="iconbtn" type="button" data-action="close-modal">✕</button></div><div class="modal-body"><div class="guide-steps">${scenes.map((x,i)=>`<button class="step ${i===ui.guideStep?'active':''}" type="button" data-action="guide-step" data-index="${i}">${i+1}. ${x.name}</button>`).join('')}</div><div class="guide-box"><div class="page-kicker">${z.sec}</div><h3>${z.title}</h3><div class="speech">“${z.say}”</div><p><strong>Thử thao tác:</strong> ${z.focus}</p></div><div class="modal-footer" style="justify-content:space-between"><div>${btn('← Trước','guide-step',`data-index="${Math.max(0,ui.guideStep-1)}" ${ui.guideStep===0?'disabled':''}`,'sm')}${btn('Tiếp →','guide-step',`data-index="${Math.min(scenes.length-1,ui.guideStep+1)}" ${ui.guideStep===scenes.length-1?'disabled':''}`,'sm')}</div>${btn('Mở màn hình cảnh này ↗','guide-open',`data-page="${z.page}"`,'primary')}</div></div></div></div>`}
function preview(){if(!ui.modal?.startsWith('preview:'))return '';let d=getObj('doc',ui.modal.split(':')[1]);return `<div class="modaloverlay" data-dismiss="modal"><div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><div class="page-kicker">Xem trước nội dung giả lập</div><h2>${esc(d.name)}</h2></div><button class="iconbtn" type="button" data-action="close-modal">✕</button></div><div class="modal-body"><div class="doc-preview"><strong>${esc(d.name)}</strong><div class="muted mini">Phiên bản v${esc(d.version)} · ${esc(d.status)}</div><hr style="border:0;border-top:1px solid #dce5ef;margin:17px 0"><p>${esc(d.summary)}</p><p style="color:#8a97a7">Đây chỉ là trang xem trước dữ liệu mô phỏng. Không có nội dung văn bản gốc hay file SASCO thật.</p></div><div class="modal-footer">${btn('Đóng bản xem trước','close-modal')}</div></div></div></div>`}
function layers(){let p=ui.noticeOpen?`<div class="notif-panel"><h3>Thông báo minh họa</h3>${notices().length?notices().map(n=>`<button class="item-row" type="button" data-action="open-detail" data-kind="${n.kind}" data-id="${n.id}"><span class="row-index">!</span><span class="item-main"><strong>${esc(n.title)}</strong><small>${esc(n.name)}</small></span></button>`).join(''):'<div class="empty">Không có thông báo mới cho góc nhìn này.</div>'}</div>`:'';return p+drawer()+(ui.modal==='guide'?guide():ui.modal?.startsWith('preview:')?preview():ui.modal?formModal():'')+(ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:'')}
function render(){document.getElementById('sidebar').innerHTML=sidebar();document.getElementById('topbar').innerHTML=topbar();document.getElementById('main').innerHTML=({home, tasks:tasksPage,approvals:approvalsPage,cases:casesPage,docs:docsPage,dashboard:dashboardPage,connections:connectionsPage,search:searchPage}[ui.page]||home)();document.getElementById('layers').innerHTML=layers()}
let toastTimer;
function toast(m){ui.toast=m;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.toast='';const t=document.querySelector('.toast');if(t)t.remove()},3600)}
function navigate(p){ui.page=p;ui.filter='Tất cả';ui.statusFilter='Tất cả';ui.noticeOpen=false;ui.detail=null;ui.modal=null;render();window.scrollTo({top:0,behavior:'instant'})}
function openDetail(kind,id){if(getObj(kind,id)){ui.detail={kind,id};ui.modal=null;ui.noticeOpen=false;render()}}
function close(){ui.detail=null;ui.modal=null;ui.noticeOpen=false;render()}
function nextId(prefix,arr){return prefix+'-'+String(Math.max(100,...arr.map(o=>Number(o.id.split('-').at(-1))||100))+1)}
function addHistory(o,msg){o.history.unshift(['15/10/2026',msg])}
function createTaskFromCase(c){let id=nextId('CV',db.tasks);let item={id,name:'Xử lý: '+c.name,owner:c.assignee,assignee:c.assignee,priority:'Trung bình',due:c.due,status:'Chưa thực hiện',progress:0,description:'Nhiệm vụ liên kết tự tạo từ vụ việc '+c.id+' (giả lập).',related:[{kind:'case',id:c.id}],history:[['15/10/2026','Tạo từ vụ việc '+c.id+'.']]};db.tasks.unshift(item);c.related.push({kind:'task',id});addHistory(c,'Đã phát sinh nhiệm vụ '+id);return id}
function approvalDecision(a,value){if(a.status==='Đã phê duyệt'||a.status==='Từ chối'){toast('Hồ sơ đã hoàn tất, không thể xử lý tiếp.');return}if(a.assigned&&a.assigned!==ui.role){toast('Vai trò hiện tại không ở bước xử lý. Hãy đổi sang: '+a.assigned);return}let note=document.getElementById('approval-note')?.value.trim();if(value==='resubmit'){a.status='Chờ xem xét';a.assigned='Đơn vị nghiệp vụ';a.step=1;addHistory(a,'Hồ sơ gửi lại sau bổ sung.'+(note?' Ghi chú: '+note:''))}else if(value==='revise'){a.status='Yêu cầu bổ sung';a.assigned=a.creator;addHistory(a,'Yêu cầu bổ sung hồ sơ.'+(note?' Ghi chú: '+note:''))}else if(value==='transfer'){a.assigned=a.assigned==='Ban Tổng Giám đốc'?'Văn phòng Công ty':'Ban Tổng Giám đốc';addHistory(a,'Chuyển người xử lý đến '+a.assigned+'.'+(note?' Ghi chú: '+note:''))}else if(value==='reject'){a.status='Từ chối';a.assigned='';addHistory(a,'Hồ sơ bị từ chối.'+(note?' Ghi chú: '+note:''))}else if(value==='approve'){if(a.step<2){a.step=2;a.assigned='Ban Tổng Giám đốc';a.status='Chờ phê duyệt';addHistory(a,'Hoàn thành xem xét, chuyển tới cấp phê duyệt.'+(note?' Ghi chú: '+note:''))}else{a.step=3;a.assigned='';a.status='Đã phê duyệt';addHistory(a,'Đã phê duyệt hồ sơ.'+(note?' Ghi chú: '+note:''));let id=nextId('CV',db.tasks);db.tasks.unshift({id,name:'Triển khai sau duyệt: '+a.name,owner:a.creator,assignee:a.creator,priority:'Trung bình',due:'2026-10-22',status:'Chưa thực hiện',progress:0,description:'Nhiệm vụ phát sinh khi hồ sơ '+a.id+' được phê duyệt (demo).',related:[{kind:'approval',id:a.id}],history:[['15/10/2026','Tạo từ hồ sơ đã phê duyệt '+a.id+'.']]});a.related.push({kind:'task',id})}}
render();toast('Đã cập nhật hồ sơ '+a.id+' (chỉ trong demo).')}
function caseAction(c,v){if(v==='assign'){let role=document.getElementById('case-assignee')?.value;if(!role){toast('Vui lòng chọn đơn vị xử lý.');return}c.assignee=role;c.status='Đang xử lý';addHistory(c,'Phân công xử lý cho '+role);render();toast('Đã phân công vụ việc '+c.id)}else if(v==='task'){if(!c.assignee){toast('Cần phân công đơn vị trước khi tạo nhiệm vụ.');return}let id=createTaskFromCase(c);openDetail('task',id);toast('Đã tạo nhiệm vụ liên kết '+id)}else if(v==='close'){let text=document.getElementById('case-result')?.value.trim();if(!text){toast('Cần nhập kết quả xử lý trước khi đóng vụ việc.');return}c.result=text;c.status='Đã đóng';addHistory(c,'Đã đóng vụ việc, ghi nhận kết quả xử lý.');render();toast('Đã đóng '+c.id+' (dữ liệu giả lập).')}}
function taskUpdate(t){let ns=document.getElementById('task-new-status')?.value,pr=Number(document.getElementById('task-progress')?.value),note=document.getElementById('task-note')?.value.trim();if(!Number.isFinite(pr)||pr<0||pr>100){toast('Tiến độ phải từ 0 đến 100%.');return}t.status=ns;t.progress=ns==='Hoàn thành'?100:pr;addHistory(t,'Cập nhật: '+ns+' · '+t.progress+'%'+(note?' · '+note:''));render();toast('Đã lưu tiến độ nhiệm vụ '+t.id)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b){if(e.target.dataset.dismiss==='drawer'||e.target.dataset.dismiss==='modal')close();return}let action=b.dataset.action,v=b.dataset.value,id=b.dataset.id;
 if(action==='nav')navigate(b.dataset.page);else if(action==='open-detail')openDetail(b.dataset.kind,id);else if(action==='close-detail'){ui.detail=null;render()}else if(action==='open-form'){ui.modal=b.dataset.form;ui.detail=null;render()}else if(action==='close-modal'){ui.modal=null;render()}else if(action==='open-guide'){ui.modal='guide';ui.detail=null;ui.guideStep=0;render()}else if(action==='guide-step'){ui.guideStep=Number(b.dataset.index);render()}else if(action==='guide-open')navigate(b.dataset.page);else if(action==='toggle-notices'){ui.noticeOpen=!ui.noticeOpen;render()}else if(action==='task-tab'||action==='approval-tab'){ui.filter=v;render()}else if(action==='case-filter'){ui.statusFilter=v;render()}else if(action==='task-update')taskUpdate(getObj('task',id));else if(action==='approval-action')approvalDecision(getObj('approval',id),v);else if(action==='case-action')caseAction(getObj('case',id),v);else if(action==='doc-preview'){ui.modal='preview:'+id;render()}else if(action==='connection-info'){toast('Đây chỉ là nhóm kết nối khả dĩ. Chưa xác định nguồn dữ liệu, quyền truy cập, API hay hệ thống thực tế.')}else if(action==='reset-data'){db=cloneInitial();ui.detail=null;render();toast('Dữ liệu demo đã được đưa về trạng thái ban đầu.')}});
document.addEventListener('change',e=>{let id=e.target.id;if(id==='role-select'){ui.role=e.target.value;ui.noticeOpen=false;render()}else if(id==='task-status-filter'){ui.statusFilter=e.target.value;render()}else if(id==='doc-status'){ui.docStatus=e.target.value;render()}else if(id==='doc-type'){ui.docType=e.target.value;render()}else if(id==='doc-owner'){ui.docOwner=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='doc-search'){ui.docSearch=e.target.value;let caret=e.target.selectionStart;render();let el=document.getElementById('doc-search');el.focus();el.setSelectionRange(caret,caret)}else if(e.target.id==='global-search'){ui.search=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='global-search'){navigate('search')} });
document.addEventListener('submit',e=>{if(e.target.id!=='create-form')return;e.preventDefault();let form=e.target,kind=form.dataset.form,fd=new FormData(form),name=String(fd.get('name')||'').trim(),description=String(fd.get('description')||'').trim();if(!name){toast('Vui lòng nhập tên hồ sơ/công việc.');return}let newId='';if(kind==='task'){let due=String(fd.get('due')||'');if(!due){toast('Cần nhập thời hạn.');return}newId=nextId('CV',db.tasks);db.tasks.unshift({id:newId,name,owner:ui.role,assignee:String(fd.get('assignee')),priority:String(fd.get('priority')),due,status:'Chưa thực hiện',progress:0,description,related:[],history:[['15/10/2026','Tạo nhiệm vụ mới trong bản demo.']]})}else if(kind==='approval'){newId=nextId('HS',db.approvals);db.approvals.unshift({id:newId,name,creator:ui.role,assigned:'Đơn vị nghiệp vụ',step:1,status:'Chờ xem xét',created:TODAY,description,related:[],history:[['15/10/2026','Khởi tạo đề xuất (giả lập).']]})}else if(kind==='case'){let due=String(fd.get('due')||'');if(!due){toast('Cần nhập thời hạn.');return}newId=nextId('VV',db.cases);db.cases.unshift({id:newId,name,type:String(fd.get('type')),source:'Biểu mẫu dùng chung (demo)',assignee:'',due,status:'Mới tiếp nhận',result:'',created:TODAY,description,related:[],history:[['15/10/2026','Tiếp nhận vụ việc mới trong demo.']]})}ui.modal=null;openDetail(kind,newId);toast('Đã tạo '+newId+' — dữ liệu chỉ dùng trong phiên demo.')});
render();
</script>
</body>
</html>
